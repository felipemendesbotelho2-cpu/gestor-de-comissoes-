<script>
/* =========================================================================
   CAMADA DE DADOS (DB)
   -------------------------------------------------------------------------
   Tudo aqui simula um banco relacional (tabelas: users, services,
   appointments, bookings) persistido em localStorage. As funções são
   assíncronas de propósito: quando migrar para um backend real (ex. Supabase),
   troque apenas o CORPO de cada método abaixo por chamadas ao SDK —
   a "assinatura" (nome, parâmetros, retorno) pode continuar igual e o
   resto do app (telas, formulários) não precisa mudar.

   Exemplo de migração futura para Supabase (guia rápido):
     const { data, error } = await supabase.from('users').select('*');
     return data;
   ========================================================================= */

const STORAGE_KEY = 'gcx_data_v1';

function loadDB(){
  let db = null;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) db = JSON.parse(raw);
  }catch(e){ console.warn('Falha ao ler storage local, iniciando vazio.', e); }
  if(!db) db = { users: [], services: [], appointments: [], bookings: [] };
  // compatibilidade: dados salvos antes da aba de agendamento não têm "bookings"
  if(!Array.isArray(db.bookings)) db.bookings = [];
  return db;
}
let dbCache = loadDB();
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(dbCache)); }
  catch(e){ console.error('Falha ao salvar dados localmente.', e); }
}

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function uid(){
  return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
}

/* Telefone: guarda só os dígitos (DDD + número, sem o 55) */
function normalizePhone(raw){
  let d = String(raw || '').replace(/\D/g, '');
  if(d.startsWith('55') && d.length > 11) d = d.slice(2);
  return d;
}
function fmtPhone(raw){
  const d = normalizePhone(raw).slice(0, 11);
  if(!d) return '';
  if(d.length <= 2) return `(${d}`;
  if(d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}

/* Valida e monta os dados de um agendamento (usado em add e update) */
function buildBookingData({ serviceId, employeeId, clientName, clientPhone, value, date, time, commissionPercent }, ignoreId, skipPhone){
  const employee = dbCache.users.find(u => u.id === employeeId && u.role === 'employee');
  if(!employee) throw new Error('Selecione um funcionário válido.');
  clientName = (clientName||'').trim();
  if(!clientName) throw new Error('Informe o nome do cliente.');
  const phone = normalizePhone(clientPhone);
  if(!skipPhone && (phone.length < 10 || phone.length > 11)) throw new Error('Informe o WhatsApp da cliente com DDD. Ex: (63) 99999-9999');
  if(!date) throw new Error('Informe a data do agendamento.');
  if(!time) throw new Error('Informe o horário do agendamento.');
  if(!(Number(value) > 0)) throw new Error('Informe um valor válido para o serviço.');
  const conflict = dbCache.bookings.some(b =>
    b.id !== ignoreId && b.employeeId === employeeId && b.date === date && b.time === time && b.status !== 'cancelado');
  if(conflict) throw new Error('Esse(a) funcionário(a) já tem um agendamento nesse horário.');
  const pct = commissionPercent === undefined || commissionPercent === null || commissionPercent === ''
    ? (Number(employee.commissionPercent)||0)
    : Math.max(0, Math.min(100, Number(commissionPercent)||0));
  return {
    serviceId: serviceId || null, employeeId, clientName, clientPhone: phone,
    value: Number(value), date, time, commissionPercentSnapshot: pct,
  };
}

/* Cada agendamento ativo gera automaticamente o lançamento (faturamento/comissão) */
function createLinkedAppointment(b){
  const a = {
    id: uid(), serviceId: b.serviceId || null, employeeId: b.employeeId,
    clientName: b.clientName, value: b.value,
    commissionPercentSnapshot: b.commissionPercentSnapshot,
    commissionValue: b.value * b.commissionPercentSnapshot / 100,
    date: b.date, createdAt: new Date().toISOString(),
  };
  dbCache.appointments.push(a);
  b.appointmentId = a.id;
  return a;
}
function removeLinkedAppointment(b){
  if(b.appointmentId) dbCache.appointments = dbCache.appointments.filter(a => a.id !== b.appointmentId);
  b.appointmentId = null;
}
function syncAppointmentFromBooking(b){
  const a = dbCache.appointments.find(x => x.id === b.appointmentId);
  if(!a) return;
  a.serviceId = b.serviceId || null;
  a.employeeId = b.employeeId;
  a.clientName = b.clientName;
  a.value = b.value;
  a.date = b.date;
  a.commissionPercentSnapshot = b.commissionPercentSnapshot;
  a.commissionValue = b.value * b.commissionPercentSnapshot / 100;
}
/* Ajusta agendamentos criados na versão anterior (que dependiam do botão "Concluir e lançar") */
function migrateBookings(){
  let changed = false;
  dbCache.bookings.forEach(b => {
    if(b.status === 'concluido'){ b.status = 'agendado'; changed = true; }
    const hasAppt = b.appointmentId && dbCache.appointments.some(a => a.id === b.appointmentId);
    if(b.status === 'agendado' && !hasAppt){ createLinkedAppointment(b); changed = true; }
  });
  if(changed) persist();
}

const DB = {
  async seedIfEmpty(){
    if(dbCache.users.length === 0){
      const passwordHash = await sha256('admin123');
      dbCache.users.push({
        id: uid(), username: 'admin', passwordHash,
        role: 'admin', name: 'Administrador(a)', commissionPercent: 0,
        createdAt: new Date().toISOString(),
      });
      persist();
    }
  },

  users: {
    async list(){ return [...dbCache.users].sort((a,b)=> a.name.localeCompare(b.name)); },
    async get(id){ return dbCache.users.find(u => u.id === id) || null; },
    async add({ username, password, name, role, commissionPercent }){
      username = (username||'').trim();
      name = (name||'').trim();
      if(!username || !password || !name) throw new Error('Preencha nome, usuário e senha.');
      const dup = dbCache.users.some(u => u.username.toLowerCase() === username.toLowerCase());
      if(dup) throw new Error('Já existe um usuário com esse nome de acesso.');
      const passwordHash = await sha256(password);
      const user = {
        id: uid(), username, passwordHash, name,
        role: role === 'admin' ? 'admin' : 'employee',
        commissionPercent: role === 'employee' ? Math.max(0, Math.min(100, Number(commissionPercent)||0)) : 0,
        createdAt: new Date().toISOString(),
      };
      dbCache.users.push(user); persist();
      return user;
    },
    async update(id, patch){
      const u = dbCache.users.find(u => u.id === id);
      if(!u) throw new Error('Usuário não encontrado.');
      if(patch.password){ u.passwordHash = await sha256(patch.password); }
      if(patch.name !== undefined) u.name = patch.name.trim();
      if(patch.commissionPercent !== undefined){
        const oldPct = Number(u.commissionPercent) || 0;
        const newPct = Math.max(0, Math.min(100, Number(patch.commissionPercent)||0));
        u.commissionPercent = newPct;
        // propaga para agendamentos e lançamentos que usavam o % padrão antigo
        // (os que tiveram % personalizado manualmente são preservados)
        if(newPct !== oldPct){
          dbCache.bookings.forEach(b => {
            if(b.employeeId === id && Number(b.commissionPercentSnapshot) === oldPct) b.commissionPercentSnapshot = newPct;
          });
          dbCache.appointments.forEach(a => {
            if(a.employeeId === id && Number(a.commissionPercentSnapshot) === oldPct){
              a.commissionPercentSnapshot = newPct;
              a.commissionValue = a.value * newPct / 100;
            }
          });
        }
      }
      persist();
      return u;
    },
    async remove(id){
      dbCache.users = dbCache.users.filter(u => u.id !== id);
      dbCache.appointments = dbCache.appointments.filter(a => a.employeeId !== id);
      dbCache.bookings = dbCache.bookings.filter(b => b.employeeId !== id);
      persist();
    },
    /* quantos agendamentos/lançamentos usam o % padrão informado (para avisar antes de mudar) */
    async usage(id, pct){
      const match = x => x.employeeId === id && Number(x.commissionPercentSnapshot) === Number(pct);
      return { bookings: dbCache.bookings.filter(match).length, appointments: dbCache.appointments.filter(match).length };
    },
    async authenticate(username, password){
      const u = dbCache.users.find(u => u.username.toLowerCase() === (username||'').trim().toLowerCase());
      if(!u) return null;
      const hash = await sha256(password);
      return hash === u.passwordHash ? u : null;
    }
  },

  services: {
    async list(){ return [...dbCache.services].sort((a,b)=> a.name.localeCompare(b.name)); },
    async add({ name, price }){
      name = (name||'').trim();
      if(!name || !(Number(price) > 0)) throw new Error('Informe nome e valor válido do serviço.');
      const s = { id: uid(), name, price: Number(price) };
      dbCache.services.push(s); persist();
      return s;
    },
    async update(id, patch){
      const s = dbCache.services.find(s => s.id === id);
      if(!s) throw new Error('Serviço não encontrado.');
      if(patch.name !== undefined) s.name = patch.name.trim();
      if(patch.price !== undefined){
        const oldPrice = Number(s.price);
        const newPrice = Number(patch.price);
        if(!(newPrice > 0)) throw new Error('Informe um valor válido para o serviço.');
        s.price = newPrice;
        // propaga para agendamentos e lançamentos que estavam com o valor padrão antigo
        // (os que tiveram valor ajustado manualmente são preservados)
        if(newPrice !== oldPrice){
          dbCache.bookings.forEach(b => {
            if(b.serviceId === id && Number(b.value) === oldPrice) b.value = newPrice;
          });
          dbCache.appointments.forEach(a => {
            if(a.serviceId === id && Number(a.value) === oldPrice){
              a.value = newPrice;
              a.commissionValue = newPrice * a.commissionPercentSnapshot / 100;
            }
          });
        }
      }
      persist();
      return s;
    },
    /* quantos agendamentos/lançamentos usam o serviço (opcionalmente só os que estão com o valor `price`) */
    async usage(id, price){
      const match = x => x.serviceId === id && (price === undefined || Number(x.value) === Number(price));
      return { bookings: dbCache.bookings.filter(match).length, appointments: dbCache.appointments.filter(match).length };
    },
    async remove(id){
      dbCache.services = dbCache.services.filter(s => s.id !== id);
      // apagar o serviço remove também os agendamentos e lançamentos ligados a ele
      dbCache.bookings = dbCache.bookings.filter(b => b.serviceId !== id);
      dbCache.appointments = dbCache.appointments.filter(a => a.serviceId !== id);
      persist();
    }
  },

  appointments: {
    async list(filters = {}){
      let list = [...dbCache.appointments];
      if(filters.employeeId) list = list.filter(a => a.employeeId === filters.employeeId);
      if(filters.from) list = list.filter(a => a.date >= filters.from);
      if(filters.to) list = list.filter(a => a.date <= filters.to);
      return list.sort((a,b) => (b.date + b.createdAt).localeCompare(a.date + a.createdAt));
    },
    async add({ serviceId, employeeId, clientName, value, date, commissionPercent }){
      const employee = dbCache.users.find(u => u.id === employeeId && u.role === 'employee');
      if(!employee) throw new Error('Selecione um funcionário válido.');
      if(!(Number(value) > 0)) throw new Error('Informe um valor válido para o atendimento.');
      const pct = commissionPercent === undefined || commissionPercent === null || commissionPercent === ''
        ? (Number(employee.commissionPercent)||0)
        : Math.max(0, Math.min(100, Number(commissionPercent)||0));
      const commissionValue = Number(value) * pct / 100;
      const a = {
        id: uid(), serviceId: serviceId || null, employeeId,
        clientName: (clientName||'').trim(), value: Number(value),
        commissionPercentSnapshot: pct,
        commissionValue, date: date || todayISO(),
        createdAt: new Date().toISOString(),
      };
      dbCache.appointments.push(a); persist();
      return a;
    },
    async update(id, { serviceId, employeeId, clientName, value, date, commissionPercent }){
      const a = dbCache.appointments.find(a => a.id === id);
      if(!a) throw new Error('Atendimento não encontrado.');
      const employee = dbCache.users.find(u => u.id === employeeId && u.role === 'employee');
      if(!employee) throw new Error('Selecione um funcionário válido.');
      if(!(Number(value) > 0)) throw new Error('Informe um valor válido para o atendimento.');
      const pct = commissionPercent === undefined || commissionPercent === null || commissionPercent === ''
        ? (Number(employee.commissionPercent)||0)
        : Math.max(0, Math.min(100, Number(commissionPercent)||0));
      a.serviceId = serviceId || null;
      a.employeeId = employeeId;
      a.clientName = (clientName||'').trim();
      a.value = Number(value);
      a.date = date || a.date;
      a.commissionPercentSnapshot = pct;
      a.commissionValue = Number(value) * pct / 100;
      // mantém o agendamento de origem (se existir) igual ao lançamento editado
      const linked = dbCache.bookings.find(b => b.appointmentId === id);
      if(linked){
        linked.serviceId = a.serviceId;
        linked.employeeId = a.employeeId;
        if(a.clientName) linked.clientName = a.clientName;
        linked.value = a.value;
        linked.date = a.date;
        linked.commissionPercentSnapshot = pct;
      }
      persist();
      return a;
    },
    async get(id){ return dbCache.appointments.find(a => a.id === id) || null; },
    async remove(id){
      dbCache.appointments = dbCache.appointments.filter(a => a.id !== id);
      // se veio de um agendamento, ele também é removido da agenda
      dbCache.bookings = dbCache.bookings.filter(b => b.appointmentId !== id);
      persist();
    }
  },

  /* ---- Agendamentos (agenda) ----
     status: 'agendado' | 'concluido' | 'cancelado'
     Ao "concluir", o agendamento vira um lançamento em `appointments`
     (é isso que entra no faturamento e nas comissões). */
  bookings: {
    async list(filters = {}){
      let list = [...dbCache.bookings];
      if(filters.employeeId) list = list.filter(b => b.employeeId === filters.employeeId);
      if(filters.date) list = list.filter(b => b.date === filters.date);
      if(filters.from) list = list.filter(b => b.date >= filters.from);
      if(filters.to) list = list.filter(b => b.date <= filters.to);
      return list.sort((a,b) => (a.date + a.time + a.createdAt).localeCompare(b.date + b.time + b.createdAt));
    },
    async get(id){ return dbCache.bookings.find(b => b.id === id) || null; },
    async add(data){
      const base = buildBookingData(data);
      const b = { id: uid(), ...base, status: 'agendado', appointmentId: null, createdAt: new Date().toISOString() };
      dbCache.bookings.push(b);
      createLinkedAppointment(b);
      persist();
      return b;
    },
    async update(id, data){
      const b = dbCache.bookings.find(b => b.id === id);
      if(!b) throw new Error('Agendamento não encontrado.');
      Object.assign(b, buildBookingData(data, id));
      if(b.status === 'agendado') syncAppointmentFromBooking(b);
      persist();
      return b;
    },
    async setStatus(id, status){
      const b = dbCache.bookings.find(b => b.id === id);
      if(!b) throw new Error('Agendamento não encontrado.');
      if(status === 'agendado'){
        buildBookingData(b, id, true); // confere se o horário continua livre
        b.status = 'agendado';
        if(!b.appointmentId) createLinkedAppointment(b);
      }else{
        removeLinkedAppointment(b); // cancelado não conta no faturamento
        b.status = status;
      }
      persist();
      return b;
    },
    async remove(id){
      const b = dbCache.bookings.find(b => b.id === id);
      if(b) removeLinkedAppointment(b);
      dbCache.bookings = dbCache.bookings.filter(b => b.id !== id);
      persist();
    }
  }
};

/* ========================= HELPERS DE FORMATAÇÃO ======================= */

const fmtBRL = n => new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' }).format(Number(n)||0);
const fmtPct = n => `${Number(n||0).toFixed(1).replace('.0','')}%`;

/* Datas sempre no fuso LOCAL (evita virar o dia às 21h no horário de Brasília) */
function localISO(d = new Date()){
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function todayISO(){ return localISO(); }
function monthRange(d = new Date()){
  return {
    from: localISO(new Date(d.getFullYear(), d.getMonth(), 1)),
    to:   localISO(new Date(d.getFullYear(), d.getMonth()+1, 0)),
  };
}
function addDaysISO(iso, n){
  const [y,m,d] = iso.split('-').map(Number);
  return localISO(new Date(y, m-1, d+n));
}
function weekdayIdx(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d).getDay();
}
const WD_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WD_LONG  = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

function fmtDateBR(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}
function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getServiceName(id){
  const s = dbCache.services.find(s => s.id === id);
  return s ? s.name : '—';
}
function getUserName(id){
  const u = dbCache.users.find(u => u.id === id);
  return u ? u.name : '—';
}

/* =============================== ESTADO ================================ */

let currentUser = null;
let currentAdminPage = 'agenda';
let currentEmployeePage = 'agenda';
let formError = '';
const root = document.getElementById('app');

function getSession(){ return sessionStorage.getItem('gcx_session_uid'); }
function setSession(id){ sessionStorage.setItem('gcx_session_uid', id); }
function clearSession(){ sessionStorage.removeItem('gcx_session_uid'); }

/* Re-renderiza a tela atual conforme o perfil logado */
function refreshApp(){
  if(!currentUser) return render();
  return currentUser.role === 'admin' ? renderAdminShell() : renderEmployeeShell();
}

/* =============================== TEMA =================================== */

function initTheme(){
  const saved = localStorage.getItem('gcx_theme');
  const wantsDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', wantsDark);
}
function toggleTheme(){
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('gcx_theme', isDark ? 'dark' : 'light');
}
initTheme();

/* ============================== BOOT ===================================== */

async function boot(){
  await DB.seedIfEmpty();
  migrateBookings();
  const uidSess = getSession();
  if(uidSess){ currentUser = await DB.users.get(uidSess); if(!currentUser) clearSession(); }
  render();
}

function render(){
  formError = '';
  if(!currentUser) return renderLogin();
  if(currentUser.role === 'admin') return renderAdminShell();
  return renderEmployeeShell();
}

/* ============================== LOGIN ==================================== */

const WHATSAPP_NUMBER = '5563993008899';
function whatsappLink(text, number = WHATSAPP_NUMBER){ return `https://wa.me/${number}?text=${encodeURIComponent(text)}`; }

function renderLogin(){
  // lê direto do cadastro: tudo que for cadastrado/editado/apagado no painel aparece aqui
  const services = [...dbCache.services].sort((a,b)=> a.name.localeCompare(b.name));
  const serviceCards = services.length ? services.map(s => {
    const msg = `Olá! Gostaria de agendar o serviço "${s.name}" (${fmtBRL(s.price)}) no Studio Vitória Vieira. Quais horários você tem disponíveis?`;
    return `
      <a href="${whatsappLink(msg)}" target="_blank" rel="noopener"
         class="group flex items-center justify-between gap-3 bg-card dark:bg-ink-soft border border-line dark:border-[#293241] hover:border-accent rounded-xl px-4 py-3.5 transition">
        <span class="min-w-0">
          <span class="block text-sm font-semibold dark:text-white truncate">${escapeHtml(s.name)}</span>
          <span class="block text-xs text-muted mono mt-0.5">${fmtBRL(s.price)}</span>
        </span>
        <span class="shrink-0 text-[11px] font-semibold text-accent bg-accent-soft dark:bg-accent/15 rounded-full px-3 py-1.5 group-hover:bg-accent group-hover:text-white transition">Agendar</span>
      </a>`;
  }).join('') : `<p class="col-span-full text-center text-sm text-muted py-6">Em breve nossos serviços estarão disponíveis aqui.</p>`;

      </div>
      <div class="grid sm:grid-cols-2 gap-3">${serviceCards}</div>
      <p class="text-center text-xs text-muted mt-6">
        Outro serviço ou dúvida?
        <a href="${whatsappLink(otherMsg)}" target="_blank" rel="noopener" class="font-semibold text-accent hover:underline">Fale com a gente</a>
      </p>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center px-5">
      <form id="login-form" class="w-full max-w-sm bg-card dark:bg-ink-soft border border-line dark:border-[#293241] rounded-2xl p-6 space-y-4 shadow-xl">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold dark:text-white">Painel de Administração</h2>
          <button type="button" id="close-login" class="w-7 h-7 flex items-center justify-center text-muted hover:text-ink dark:hover:text-white" aria-label="Fechar">✕</button>
        </div>
        <div>
          <label class="block text-xs font-semibold text-muted mb-1.5">Usuário</label>
          <input id="login-username" type="text" autocomplete="username" placeholder="ex: admin"
            class="w-full rounded-lg border border-line dark:border-[#2C3949] dark:bg-[#151C25] dark:text-white px-3.5 py-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-muted mb-1.5">Senha</label>
          <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••"
            class="w-full rounded-lg border border-line dark:border-[#2C3949] dark:bg-[#151C25] dark:text-white px-3.5 py-2.5 text-sm">
        </div>
        <div id="login-error" class="text-xs text-rose-600 dark:text-rose-400 min-h-[1rem]"></div>
        <button type="submit" class="w-full bg-ink dark:bg-accent hover:opacity-90 transition text-white text-sm font-semibold rounded-lg py-2.5">
          Entrar
        </button>
      </form>
    </div>
  </div>`;

  const modal = document.getElementById('login-modal');
  const openLogin = () => { modal.classList.remove('hidden'); setTimeout(() => document.getElementById('login-username')?.focus(), 50); };
  const closeLogin = () => { document.getElementById('login-modal')?.classList.add('hidden'); };
  document.getElementById('open-login').addEventListener('click', openLogin);
  document.getElementById('close-login').addEventListener('click', closeLogin);
  modal.addEventListener('click', (e) => { if(e.target === modal) closeLogin(); });
  document.onkeydown = (e) => { if(e.key === 'Escape') closeLogin(); };

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    if(!username || !password){ errEl.textContent = 'Preencha usuário e senha.'; return; }

    if(!user){ errEl.textContent = 'Usuário ou senha inválidos.'; return; }

    setSession(user.id);
    render();
  });

function logout(){
  currentUser = null;
  clearSession();
  render();
}

/* ===================== AGENDAMENTO (admin + funcionária) ================= */

let agendaState = { date: todayISO(), employeeId: '' };
let agendaEditingId = null;

const BOOKING_STATUS = {
  agendado:  { label: 'Agendado',  cls: 'bg-gold-soft text-gold dark:bg-gold/15' },
  concluido: { label: 'Concluído', cls: 'bg-accent-soft text-accent dark:bg-accent/15' },
  cancelado: { label: 'Cancelado', cls: 'bg-slate-200 text-slate-500 dark:bg-white/10 dark:text-white/50' },
};

async function pageAgenda(){
  const isAdmin = currentUser.role === 'admin';
  const services = await DB.services.list();
  const employees = (await DB.users.list()).filter(u => u.role === 'employee');
  const empFilter = isAdmin ? agendaState.employeeId : currentUser.id;
  const day = agendaState.date;

  const weekStart = addDaysISO(day, -weekdayIdx(day));
  const weekEnd = addDaysISO(weekStart, 6);
  const weekList = await DB.bookings.list({ from: weekStart, to: weekEnd, employeeId: empFilter || undefined });
  const dayList = weekList.filter(b => b.date === day);

  const counts = {};
  weekList.forEach(b => { if(b.status !== 'cancelado') counts[b.date] = (counts[b.date] || 0) + 1; });

  const activeDay = dayList.filter(b => b.status !== 'cancelado');
  const totalPrevisto = activeDay.reduce((s,b) => s + b.value, 0);
  const comissaoPrevista = activeDay.reduce((s,b) => s + b.value * b.commissionPercentSnapshot / 100, 0);

  const today = todayISO();
  const weekStrip = Array.from({ length: 7 }, (_, i) => {
    const iso = addDaysISO(weekStart, i);
    const active = iso === day;
    const n = counts[iso] || 0;
    return `
      <button data-day="${iso}" class="flex-1 min-w-[48px] rounded-xl border px-1 py-2 text-center transition
        ${active ? 'bg-ink text-white border-ink dark:bg-accent dark:border-accent' : 'bg-card dark:bg-ink-soft border-line dark:border-[#22303F] hover:border-accent'}">
        <span class="block text-[10px] font-semibold uppercase tracking-wide ${active ? 'text-white/70' : 'text-muted'}">${WD_SHORT[i]}</span>
        <span class="block text-base font-bold mono ${active ? '' : 'dark:text-white'}">${iso.slice(8,10)}</span>
        <span class="block text-[10px] ${active ? 'text-white/80' : (n ? 'text-accent font-semibold' : 'text-muted')}">${iso === today ? 'hoje' : (n ? n + ' ag.' : '·')}</span>
      </button>`;
  }).join('');

  const rows = dayList.length ? dayList.map(b => {
    const st = BOOKING_STATUS[b.status] || BOOKING_STATUS.agendado;
    const cancelled = b.status === 'cancelado';
    const commission = b.value * b.commissionPercentSnapshot / 100;
    const firstName = (b.clientName || '').split(' ')[0];
    const confirmMsg = `Olá, ${firstName}! Aqui é do Studio Vitória Vieira. Estou passando para confirmar seu horário de ${getServiceName(b.serviceId)} no dia ${fmtDateBR(b.date)} às ${b.time}. Está tudo certo?`;
    const phoneHtml = b.clientPhone
      ? `<a href="${whatsappLink(confirmMsg, '55' + b.clientPhone)}" target="_blank" rel="noopener" class="inline-block text-xs font-semibold text-accent hover:underline mt-1">WhatsApp ${fmtPhone(b.clientPhone)} · Confirmar horário</a>`
      : `<span class="inline-block text-[11px] text-muted mt-1">Sem WhatsApp cadastrado (edite para adicionar)</span>`;
    const actions = [];
    if(b.status === 'agendado'){
      actions.push(`<button data-bk-edit="${b.id}" class="text-xs font-semibold text-accent hover:underline">Editar</button>`);
      actions.push(`<button data-bk-cancel="${b.id}" class="text-xs font-semibold text-muted hover:underline">Cancelar</button>`);
    }
    if(b.status === 'cancelado'){
      actions.push(`<button data-bk-reopen="${b.id}" class="text-xs font-semibold text-accent hover:underline">Reativar</button>`);
    }
    actions.push(`<button data-bk-del="${b.id}" class="text-xs font-semibold text-rose-600 hover:underline">Excluir</button>`);

    return `
    <div class="flex flex-wrap items-start gap-x-4 gap-y-3 px-5 py-4 border-t border-line dark:border-[#22303F] ${cancelled ? 'opacity-60' : ''}">
      <div class="w-14 shrink-0 pt-0.5">
        <p class="mono text-base font-semibold dark:text-white">${escapeHtml(b.time)}</p>
      </div>
      <div class="flex-1 min-w-[170px]">
        <p class="text-sm font-semibold dark:text-white ${cancelled ? 'line-through' : ''}">${escapeHtml(getServiceName(b.serviceId))}</p>
        <p class="text-xs text-muted mt-0.5">Cliente: <span class="font-semibold text-ink dark:text-white/80">${escapeHtml(b.clientName)}</span>${isAdmin ? ' · ' + escapeHtml(getUserName(b.employeeId)) : ''}</p>
        ${phoneHtml}
      </div>
      <div class="text-right">
        <p class="mono text-sm dark:text-white/90">${fmtBRL(b.value)}</p>
        <p class="mono text-[11px] text-accent">comissão ${fmtBRL(commission)}</p>
      </div>
      <div class="w-full flex items-center gap-x-4 gap-y-2 flex-wrap">
        <span class="text-[11px] font-semibold rounded-full px-2.5 py-1 ${st.cls}">${st.label}</span>
        ${actions.join('')}
      </div>
    </div>`;
  }).join('') : `<div class="px-5 py-10 text-center text-sm text-muted border-t border-line dark:border-[#22303F]">Nenhum agendamento neste dia.</div>`;

  const serviceOptions = `<option value="">Nenhum (valor livre)</option>` + services.map(s =>
    `<option value="${s.id}" data-price="${s.price}">${escapeHtml(s.name)} · ${fmtBRL(s.price)}</option>`).join('');
  const employeeOptions = employees.length
    ? employees.map(u => `<option value="${u.id}" data-pct="${u.commissionPercent}">${escapeHtml(u.name)} · comissão ${fmtPct(u.commissionPercent)}</option>`).join('')
    : `<option value="">Cadastre um funcionário primeiro</option>`;
  const filterOptions = `<option value="">Todos os funcionários</option>` + employees.map(u =>
    `<option value="${u.id}" ${agendaState.employeeId === u.id ? 'selected' : ''}>${escapeHtml(u.name)}</option>`).join('');

  const inputCls = 'w-full rounded-lg border border-line dark:border-[#2C3949] dark:bg-[#151C25] dark:text-white px-3 py-2 text-sm';

  return `
    <div class="flex flex-wrap items-center gap-2 mb-4">
      <button id="ag-prev" class="w-9 h-9 rounded-lg border border-line dark:border-[#2C3949] dark:text-white flex items-center justify-center" title="Dia anterior">‹</button>
      <input id="ag-date-pick" type="date" value="${day}" class="${inputCls} !w-auto mono">
      <button id="ag-next" class="w-9 h-9 rounded-lg border border-line dark:border-[#2C3949] dark:text-white flex items-center justify-center" title="Próximo dia">›</button>
      <button id="ag-today" class="text-xs font-semibold border border-line dark:border-[#2C3949] dark:text-white rounded-lg px-3 py-2.5">Hoje</button>
      ${isAdmin ? `<select id="ag-emp-filter" class="${inputCls} !w-auto sm:ml-auto">${filterOptions}</select>` : ''}
    </div>

    <div class="flex gap-2 mb-6 overflow-x-auto pb-1">${weekStrip}</div>

    <div class="grid lg:grid-cols-[1fr_360px] gap-6 items-start">
      <div class="bg-card dark:bg-ink-soft border border-line dark:border-[#22303F] rounded-2xl overflow-hidden">
        <div class="px-5 py-4 flex items-center justify-between flex-wrap gap-2">
          <div>
            <h2 class="text-sm font-bold dark:text-white">${WD_LONG[weekdayIdx(day)]}, ${fmtDateBR(day)}</h2>
            <p class="text-xs text-muted mt-0.5">${activeDay.length} agendamento(s) ativo(s)</p>
          </div>
          <div class="text-right">
            <p class="mono text-sm font-semibold dark:text-white">${fmtBRL(totalPrevisto)}</p>
            <p class="mono text-[11px] text-accent">comissão prevista ${fmtBRL(comissaoPrevista)}</p>
          </div>
        </div>
        ${rows}
      </div>

      <div class="bg-card dark:bg-ink-soft border border-line dark:border-[#22303F] rounded-2xl p-5">
        <div class="flex items-center justify-between mb-4">
          <h2 id="ag-form-title" class="text-sm font-bold dark:text-white">Novo agendamento</h2>
          <button type="button" id="ag-cancel-edit" class="hidden text-xs font-semibold text-muted hover:underline">Cancelar edição</button>
        </div>
        <form id="ag-form" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-muted mb-1.5">Cliente</label>
            <input id="ag-client" class="${inputCls}" placeholder="Nome do cliente">
          </div>
          <div>
            <label class="block text-xs font-semibold text-muted mb-1.5">WhatsApp da cliente</label>
            <input id="ag-phone" type="tel" inputmode="tel" autocomplete="off" class="${inputCls} mono" placeholder="(63) 99999-9999">
            <p class="text-[11px] text-muted mt-1">Usado para confirmar o horário com a cliente.</p>
          </div>
          <div>
            <label class="block text-xs font-semibold text-muted mb-1.5">Serviço</label>
            <select id="ag-service" class="${inputCls}">${serviceOptions}</select>
          </div>
          ${isAdmin ? `
          <div>
            <label class="block text-xs font-semibold text-muted mb-1.5">Funcionário responsável</label>
            <select id="ag-employee" class="${inputCls}">${employeeOptions}</select>
          </div>` : `
          <div class="bg-paper dark:bg-white/5 rounded-lg px-3 py-2 text-xs text-muted">
            Agendando para <span class="font-semibold text-ink dark:text-white">${escapeHtml(currentUser.name)}</span>
          </div>`}
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-muted mb-1.5">Data</label>
              <input id="ag-form-date" type="date" class="${inputCls} mono">

            <div>
              <label class="block text-xs font-semibold text-muted mb-1.5">Horário</label>
              <input id="ag-time" type="time" class="${inputCls} mono">

          </div>
          <div>
            <label class="block text-xs font-semibold text-muted mb-1.5">Valor</label>
            <input id="ag-value" type="number" min="0" step="0.01" class="${inputCls} mono" placeholder="0,00">
          </div>
          ${isAdmin ? `
          <div>
            <label class="block text-xs font-semibold text-muted mb-1.5">Comissão neste atendimento</label>
            <div class="relative">
              <input id="ag-pct" type="number" min="0" max="100" step="0.5" class="${inputCls} mono" placeholder="ex: 30">
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-muted">%</span>
            </div>
            <p class="text-[11px] text-muted mt-1">Vem com o % padrão do funcionário; mude só se este atendimento for diferente.</p>
          </div>` : ''}
          <div class="bg-accent-soft dark:bg-accent/10 rounded-lg px-3.5 py-3 flex items-center justify-between">
            <span class="text-xs font-semibold text-accent-dark dark:text-accent">Comissão estimada</span>
            <span id="ag-preview" class="text-sm font-bold mono text-accent">R$ 0,00</span>
          </div>
          <div id="ag-error" class="text-xs text-rose-600 dark:text-rose-400 min-h-[1rem]"></div>
          <button type="submit" id="ag-submit" class="w-full bg-ink dark:bg-accent text-white text-sm font-semibold rounded-lg py-2.5 hover:opacity-90 transition">Agendar</button>
        </form>
      </div>
    </div>`;
}

function attachAgendaHandlers(){
  agendaEditingId = null;
  const isAdmin = currentUser.role === 'admin';

  const goDay = (iso) => { if(!iso) return; agendaState.date = iso; refreshApp(); };
  document.getElementById('ag-prev').addEventListener('click', () => goDay(addDaysISO(agendaState.date, -1)));
  document.getElementById('ag-next').addEventListener('click', () => goDay(addDaysISO(agendaState.date, 1)));
  document.getElementById('ag-today').addEventListener('click', () => goDay(todayISO()));
  document.getElementById('ag-date-pick').addEventListener('change', (e) => goDay(e.target.value));
  document.querySelectorAll('[data-day]').forEach(btn => btn.addEventListener('click', () => goDay(btn.dataset.day)));
  document.getElementById('ag-emp-filter')?.addEventListener('change', (e) => {
    agendaState.employeeId = e.target.value;
    refreshApp();
  });

  /* --- formulário --- */
  const form = document.getElementById('ag-form');
  const serviceSel = document.getElementById('ag-service');
  const employeeSel = document.getElementById('ag-employee');
  const clientEl = document.getElementById('ag-client');
  const phoneEl = document.getElementById('ag-phone');
  phoneEl.addEventListener('input', () => { phoneEl.value = fmtPhone(phoneEl.value); });
  const dateEl = document.getElementById('ag-form-date');
  const timeEl = document.getElementById('ag-time');
  const valueEl = document.getElementById('ag-value');
  const pctEl = document.getElementById('ag-pct');
  const preview = document.getElementById('ag-preview');
  const titleEl = document.getElementById('ag-form-title');
  const cancelBtn = document.getElementById('ag-cancel-edit');
  const submitBtn = document.getElementById('ag-submit');
  const errEl = document.getElementById('ag-error');

  dateEl.value = agendaState.date;

  const currentPct = () => isAdmin ? Number(pctEl.value || 0) : Number(currentUser.commissionPercent || 0);
  function updatePreview(){ preview.textContent = fmtBRL(Number(valueEl.value || 0) * currentPct() / 100); }
  function fillDefaultPct(){
    if(!isAdmin){ updatePreview(); return; }
    const pct = employeeSel.selectedOptions[0]?.dataset.pct;
    pctEl.value = pct !== undefined ? pct : '';
    updatePreview();
  }

  serviceSel.addEventListener('change', () => {
    const price = serviceSel.selectedOptions[0]?.dataset.price;
    if(price) valueEl.value = Number(price).toFixed(2);
    updatePreview();
  });
  employeeSel?.addEventListener('change', fillDefaultPct);
  valueEl.addEventListener('input', updatePreview);
  pctEl?.addEventListener('input', updatePreview);
  fillDefaultPct();

  function resetToCreateMode(){
    agendaEditingId = null;
    titleEl.textContent = 'Novo agendamento';
    submitBtn.textContent = 'Agendar';
    cancelBtn.classList.add('hidden');
    errEl.textContent = '';
    form.reset();
    dateEl.value = agendaState.date;
    fillDefaultPct();
  }
  cancelBtn.addEventListener('click', resetToCreateMode);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.textContent = '';
    const payload = {
      serviceId: serviceSel.value || null,
      employeeId: isAdmin ? employeeSel.value : currentUser.id,
      clientName: clientEl.value,
      clientPhone: phoneEl.value,
      value: valueEl.value,
      date: dateEl.value,
      time: timeEl.value,
      commissionPercent: isAdmin ? pctEl.value : undefined,
    };
    try{
      if(agendaEditingId) await DB.bookings.update(agendaEditingId, payload);
      else await DB.bookings.add(payload);
      agendaState.date = payload.date;
      await refreshApp();
    }catch(err){ errEl.textContent = err.message; }
  });

  /* --- ações nas linhas da agenda --- */
  const run = async (fn) => {
    try{ await fn(); await refreshApp(); }
    catch(err){ alert(err.message); }
  };

  document.querySelectorAll('[data-bk-cancel]').forEach(btn => btn.addEventListener('click', () => {
    if(!confirm('Cancelar este agendamento? Ele deixa de contar no faturamento e nas comissões.')) return;
    run(() => DB.bookings.setStatus(btn.dataset.bkCancel, 'cancelado'));
  }));
  document.querySelectorAll('[data-bk-reopen]').forEach(btn => btn.addEventListener('click', () => {
    run(() => DB.bookings.setStatus(btn.dataset.bkReopen, 'agendado'));
  }));
  document.querySelectorAll('[data-bk-del]').forEach(btn => btn.addEventListener('click', async () => {
    const b = await DB.bookings.get(btn.dataset.bkDel);
    const msg = 'Excluir este agendamento? Ele também sai do faturamento e das comissões.';
    if(!confirm(msg)) return;
    run(() => DB.bookings.remove(btn.dataset.bkDel));
  }));

  document.querySelectorAll('[data-bk-edit]').forEach(btn => btn.addEventListener('click', async () => {
    const b = await DB.bookings.get(btn.dataset.bkEdit);
    if(!b) return;
    agendaEditingId = b.id;
    clientEl.value = b.clientName;
    phoneEl.value = b.clientPhone ? fmtPhone(b.clientPhone) : '';
    serviceSel.value = b.serviceId || '';
    if(isAdmin) employeeSel.value = b.employeeId;
    dateEl.value = b.date;
    timeEl.value = b.time;
    valueEl.value = b.value;
    if(isAdmin) pctEl.value = b.commissionPercentSnapshot;
    updatePreview();
    titleEl.textContent = 'Editar agendamento';
    submitBtn.textContent = 'Salvar alterações';
    cancelBtn.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }));
}

function goAdmin(page){ currentAdminPage = page; closeMobileNav(); renderAdminShell(); }

async function renderAdminShell(){
  const navHtml = [
    navItem('◫','Agendamento', currentAdminPage==='agenda', "goAdmin('agenda')"),
    navItem('◇','Visão geral', currentAdminPage==='overview', "goAdmin('overview')"),
    navItem('◈','Funcionários', currentAdminPage==='employees', "goAdmin('employees')"),
    navItem('◆','Serviços', currentAdminPage==='services', "goAdmin('services')"),
    navItem('＋','Lançar atendimento', currentAdminPage==='launch', "goAdmin('launch')"),
    navItem('▤','Relatório geral', currentAdminPage==='report', "goAdmin('report')"),
  ].join('');

  const titles = {
    agenda: ['Agendamento', 'Agenda por dia e horário, com lançamento do serviço'],
    overview: ['Visão geral', 'Resumo do faturamento e comissões'],
    employees: ['Funcionários', 'Cadastro e percentuais de comissão'],
    services: ['Serviços', 'Catálogo de serviços e valores padrão'],
    launch: ['Lançar atendimento', 'Registrar um serviço executado'],
    report: ['Relatório geral', 'Comissões por período e funcionário'],
  };
  const [title, subtitle] = titles[currentAdminPage];

  shellLayout({ navHtml, title, subtitle, contentHtml: `<div id="page-inner"></div>` });
  const inner = document.getElementById('page-inner');

  if(currentAdminPage === 'agenda') inner.innerHTML = await pageAgenda();
  if(currentAdminPage === 'overview') inner.innerHTML = await pageAdminOverview();
  if(currentAdminPage === 'employees') inner.innerHTML = await pageAdminEmployees();
  if(currentAdminPage === 'services') inner.innerHTML = await pageAdminServices();
  if(currentAdminPage === 'launch') inner.innerHTML = await pageAdminLaunch();
  if(currentAdminPage === 'report') inner.innerHTML = await pageAdminReport();

  attachAdminPageHandlers();
}

function attachAdminPageHandlers(){
  if(currentAdminPage === 'agenda') attachAgendaHandlers();
  if(currentAdminPage === 'employees') attachEmployeesHandlers();
  if(currentAdminPage === 'services') attachServicesHandlers();
  if(currentAdminPage === 'launch') attachLaunchHandlers();
  if(currentAdminPage === 'report') attachReportHandlers();
}

function attachEmployeesHandlers(){
  document.getElementById('employee-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('employee-error');
    errEl.textContent = '';
    try{
      await DB.users.add({
        name: document.getElementById('emp-name').value,
        username: document.getElementById('emp-username').value,
        password: document.getElementById('emp-password').value,
        role: 'employee',
        commissionPercent: document.getElementById('emp-commission').value,
      });
      await renderAdminShell();
    }catch(err){ errEl.textContent = err.message; }
  });

  document.querySelectorAll('[data-edit-emp]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const u = await DB.users.get(btn.dataset.editEmp);
      const nome = prompt('Nome do(a) funcionário(a):', u.name);
      if(nome === null) return;
      if(!nome.trim()){ alert('Informe um nome.'); return; }
      const novo = prompt(`Percentual de comissão para ${nome.trim()} (atual: ${fmtPct(u.commissionPercent)}):`, u.commissionPercent);
      if(novo === null) return;
      const num = Number(String(novo).replace(',', '.'));
      if(isNaN(num) || num < 0 || num > 100){ alert('Informe um número entre 0 e 100.'); return; }
      if(num !== Number(u.commissionPercent)){
        const use = await DB.users.usage(u.id, u.commissionPercent);
        if(use.bookings + use.appointments > 0){
          const ok = confirm(`Mudar a comissão de ${fmtPct(u.commissionPercent)} para ${fmtPct(num)} também vai atualizar ${use.bookings} agendamento(s) e ${use.appointments} lançamento(s) que estão com o % antigo, e recalcular os valores de comissão.\n\nContinuar?`);
          if(!ok) return;
        }
      }
      await DB.users.update(u.id, { name: nome, commissionPercent: num });
      await renderAdminShell();
    });
  });

  document.querySelectorAll('[data-del-emp]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Excluir este funcionário? Os atendimentos e agendamentos dele também serão removidos.')) return;
      await DB.users.remove(btn.dataset.delEmp);
      await renderAdminShell();
    });
  });
}

let launchEditingId = null;

function attachLaunchHandlers(){
  launchEditingId = null;
  const dateEl = document.getElementById('launch-date');
  dateEl.value = todayISO();

  const serviceSel = document.getElementById('launch-service');
  const employeeSel = document.getElementById('launch-employee');
  const valueEl = document.getElementById('launch-value');
  const pctEl = document.getElementById('launch-commission-pct');
  const preview = document.getElementById('launch-commission-preview');
  const titleEl = document.getElementById('launch-form-title');
  const cancelBtn = document.getElementById('launch-cancel-edit');
  const submitBtn = document.getElementById('launch-submit-btn');

  function updatePreview(){
    const pct = Number(pctEl.value || 0);
    const val = Number(valueEl.value || 0);
    preview.textContent = fmtBRL(val * pct / 100);
  }
  function fillDefaultCommission(){
    const pct = employeeSel.selectedOptions[0]?.dataset.pct;
    pctEl.value = pct !== undefined ? pct : '';
    updatePreview();
  }
  serviceSel.addEventListener('change', () => {
    const price = serviceSel.selectedOptions[0]?.dataset.price;
    if(price) valueEl.value = Number(price).toFixed(2);
    updatePreview();
  });
  employeeSel.addEventListener('change', fillDefaultCommission);
  valueEl.addEventListener('input', updatePreview);
  pctEl.addEventListener('input', updatePreview);
  fillDefaultCommission();

  function resetToCreateMode(){
    launchEditingId = null;
    titleEl.textContent = 'Novo atendimento';
    submitBtn.textContent = 'Registrar atendimento';
    cancelBtn.classList.add('hidden');
    document.getElementById('launch-form').reset();
    dateEl.value = todayISO();
    fillDefaultCommission();
  }
  cancelBtn.addEventListener('click', resetToCreateMode);

  document.getElementById('launch-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('launch-error');
    errEl.textContent = '';
    const payload = {
      serviceId: serviceSel.value || null,
      employeeId: employeeSel.value,
      clientName: document.getElementById('launch-client').value,
      value: valueEl.value,
      date: dateEl.value,
      commissionPercent: pctEl.value,
    };
    try{
      if(launchEditingId){
        await DB.appointments.update(launchEditingId, payload);
      }else{
        await DB.appointments.add(payload);
      }
      await renderAdminShell();
    }catch(err){ errEl.textContent = err.message; }
  });

  document.querySelectorAll('[data-edit-appt]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const a = await DB.appointments.get(btn.dataset.editAppt);
      if(!a) return;
      launchEditingId = a.id;
      serviceSel.value = a.serviceId || '';
      employeeSel.value = a.employeeId;
      document.getElementById('launch-client').value = a.clientName || '';
      valueEl.value = a.value;
      dateEl.value = a.date;
      pctEl.value = a.commissionPercentSnapshot;
      updatePreview();
      titleEl.textContent = 'Editar atendimento';
      submitBtn.textContent = 'Salvar alterações';
      cancelBtn.classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  document.querySelectorAll('[data-del-appt]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if(!confirm('Excluir este lançamento?')) return;
      await DB.appointments.remove(btn.dataset.delAppt);
      await renderAdminShell();
    });
  });
}

/* --- Relatório geral --- */
let reportFilters = { from: monthRange().from, to: monthRange().to, employeeId: '' };

async function pageAdminReport(){
  const employees = (await DB.users.list()).filter(u => u.role === 'employee');
  const list = await DB.appointments.list({ from: reportFilters.from, to: reportFilters.to, employeeId: reportFilters.employeeId || undefined });

  const byEmployee = {};
  for(const a of list){
    if(!byEmployee[a.employeeId]) byEmployee[a.employeeId] = { faturamento: 0, comissao: 0, qtd: 0 };
    byEmployee[a.employeeId].faturamento += a.value;
    byEmployee[a.employeeId].comissao += a.commissionValue;
    byEmployee[a.employeeId].qtd += 1;
  }
  const totalFaturamento = list.reduce((s,a)=> s + a.value, 0);
  const totalComissao = list.reduce((s,a)=> s + a.commissionValue, 0);

  const employeeOptions = `<option value="">Todos os funcionários</option>` + employees.map(u =>
    `<option value="${u.id}" ${reportFilters.employeeId===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('');

  const summaryRows = Object.keys(byEmployee).length ? Object.entries(byEmployee).map(([empId, v]) => `
    <tr class="border-t border-line dark:border-[#22303F]">
      <td class="py-2.5 pr-3 text-sm font-medium dark:text-white/90">${escapeHtml(getUserName(empId))}</td>
      <td class="py-2.5 pr-3 text-sm mono text-right dark:text-white/90">${v.qtd}</td>
      <td class="py-2.5 pr-3 text-sm mono text-right dark:text-white/90">${fmtBRL(v.faturamento)}</td>
      <td class="py-2.5 text-sm mono text-right text-accent font-semibold">${fmtBRL(v.comissao)}</td>
    </tr>`).join('') : `<tr><td colspan="4" class="py-6 text-center text-sm text-muted">Nenhum resultado para o período/filtro selecionado.</td></tr>`;

  const detailRows = list.length ? list.map(a => `
    <tr class="border-t border-line dark:border-[#22303F]">
      <td class="py-2 pr-3 text-xs dark:text-white/80">${fmtDateBR(a.date)}</td>
      <td class="py-2 pr-3 text-xs dark:text-white/80">${escapeHtml(getUserName(a.employeeId))}</td>
      <td class="py-2 pr-3 text-xs text-muted">${escapeHtml(getServiceName(a.serviceId))}</td>
      <td class="py-2 pr-3 text-xs text-muted">${escapeHtml(a.clientName || '—')}</td>
      <td class="py-2 pr-3 text-xs mono text-right dark:text-white/80">${fmtBRL(a.value)}</td>
      <td class="py-2 text-xs mono text-right text-accent">${fmtBRL(a.commissionValue)}</td>
    </tr>`).join('') : '';

  return `
    <div class="bg-card dark:bg-ink-soft border border-line dark:border-[#22303F] rounded-2xl p-5 mb-6">
      <h2 class="text-sm font-bold mb-4 dark:text-white">Filtros</h2>
      <form id="report-form" class="grid sm:grid-cols-[1fr_1fr_1fr_auto] gap-3 items-end">
        <div>
          <label class="block text-xs font-semibold text-muted mb-1.5">De</label>
          <input id="report-from" type="date" value="${reportFilters.from}" class="w-full rounded-lg border border-line dark:border-[#2C3949] dark:bg-[#151C25] dark:text-white px-3 py-2 text-sm mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-muted mb-1.5">Até</label>
          <input id="report-to" type="date" value="${reportFilters.to}" class="w-full rounded-lg border border-line dark:border-[#2C3949] dark:bg-[#151C25] dark:text-white px-3 py-2 text-sm mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-muted mb-1.5">Funcionário</label>
          <select id="report-employee" class="w-full rounded-lg border border-line dark:border-[#2C3949] dark:bg-[#151C25] dark:text-white px-3 py-2 text-sm">${employeeOptions}</select>
        </div>
        <button type="submit" class="bg-ink dark:bg-accent text-white text-sm font-semibold rounded-lg py-2.5 px-5 hover:opacity-90 transition whitespace-nowrap">Filtrar</button>
      </form>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-6">
      <div class="bg-card dark:bg-ink-soft border border-line dark:border-[#22303F] rounded-2xl p-5">
        <p class="text-xs font-semibold text-muted mb-2">Faturamento no período</p>
        <p class="text-xl font-bold mono dark:text-white">${fmtBRL(totalFaturamento)}</p>
      </div>
      <div class="bg-card dark:bg-ink-soft border border-line dark:border-[#22303F] rounded-2xl p-5">
        <p class="text-xs font-semibold text-muted mb-2">Comissões a pagar</p>
        <p class="text-xl font-bold mono text-accent">${fmtBRL(totalComissao)}</p>
      </div>
    </div>

    <div class="bg-card dark:bg-ink-soft border border-line dark:border-[#22303F] rounded-2xl overflow-hidden mb-6">
      <div class="px-5 py-4 border-b border-line dark:border-[#22303F]"><h2 class="text-sm font-bold dark:text-white">Fechamento por funcionário</h2></div>
      <div class="overflow-x-auto px-5">
        <table class="w-full min-w-[420px]">
          <thead><tr class="text-left text-[11px] font-semibold text-muted uppercase tracking-wide">
            <th class="pb-2 pt-4">Funcionário</th><th class="pb-2 pt-4 text-right">Atend.</th><th class="pb-2 pt-4 text-right">Faturamento</th><th class="pb-2 pt-4 text-right">Comissão</th>
          </tr></thead>
          <tbody>${summaryRows}</tbody>
        </table>
      </div>
      <div class="h-2"></div>
    </div>

    ${list.length ? `
    <div class="bg-card dark:bg-ink-soft border border-line dark:border-[#22303F] rounded-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-line dark:border-[#22303F]"><h2 class="text-sm font-bold dark:text-white">Detalhamento</h2></div>
      <div class="overflow-x-auto px-5 max-h-96 overflow-y-auto">
        <table class="w-full min-w-[560px]">
          <thead class="sticky top-0 bg-card dark:bg-ink-soft"><tr class="text-left text-[11px] font-semibold text-muted uppercase tracking-wide">
            <th class="pb-2 pt-4">Data</th><th class="pb-2 pt-4">Funcionário</th><th class="pb-2 pt-4">Serviço</th><th class="pb-2 pt-4">Cliente</th>
            <th class="pb-2 pt-4 text-right">Valor</th><th class="pb-2 pt-4 text-right">Comissão</th>
          </tr></thead>
          <tbody>${detailRows}</tbody>
        </table>
      </div>
      <div class="h-3"></div>
    </div>` : ''}`;
}

function attachReportHandlers(){
  document.getElementById('report-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    reportFilters = {
      from: document.getElementById('report-from').value,
      to: document.getElementById('report-to').value,
      employeeId: document.getElementById('report-employee').value,
    };
    await renderAdminShell();
  });
}

/* ========================= PAINEL FUNCIONÁRIO ============================ */

function goEmployee(page){ currentEmployeePage = page; closeMobileNav(); renderEmployeeShell(); }

async function renderEmployeeShell(){
  const navHtml = [
    navItem('◫','Agendamento', currentEmployeePage==='agenda', "goEmployee('agenda')"),
    navItem('◷','Resumo do mês', currentEmployeePage==='resumo', "goEmployee('resumo')"),
    navItem('▤','Meus atendimentos', currentEmployeePage==='meus', "goEmployee('meus')"),
  ].join('');

  const titles = {
    agenda: ['Agendamento', 'Sua agenda por dia e horário'],
    resumo: ['Resumo do mês', 'Suas comissões no mês atual'],
    meus: ['Meus atendimentos', 'Serviços que você executou'],
  };
  const [title, subtitle] = titles[currentEmployeePage];

  shellLayout({ navHtml, title, subtitle, contentHtml: `<div id="page-inner"></div>` });
  const inner = document.getElementById('page-inner');

  if(currentEmployeePage === 'agenda'){
    inner.innerHTML = await pageAgenda();
    attachAgendaHandlers();
  }else if(currentEmployeePage === 'resumo'){
    inner.innerHTML = await pageEmployeeResumo();
  }else{
    inner.innerHTML = await pageEmployeeMeus();
  }
}

async function pageEmployeeResumo(){
  const { from, to } = monthRange();
  const list = await DB.appointments.list({ employeeId: currentUser.id, from, to });
  const faturado = list.reduce((s,a)=> s + a.value, 0);
  const comissao = list.reduce((s,a)=> s + a.commissionValue, 0);

  const cards = [
    ['Comissão do mês', fmtBRL(comissao), 'text-accent'],
    ['Total atendido por você', fmtBRL(faturado), 'text-ink dark:text-white'],
    ['Atendimentos no mês', list.length, 'text-ink dark:text-white'],
  ].map(([label, value, cls]) => `
    <div class="bg-card dark:bg-ink-soft border border-line dark:border-[#22303F] rounded-2xl p-5">
      <p class="text-xs font-semibold text-muted mb-2">${label}</p>
      <p class="text-2xl font-bold mono ${cls}">${value}</p>
    </div>`).join('');

  return `
    <div class="bg-accent-soft dark:bg-accent/10 border border-accent/20 rounded-2xl px-5 py-4 mb-6 flex items-center justify-between flex-wrap gap-2">
      <span class="text-sm text-accent-dark dark:text-accent font-medium">Seu percentual de comissão atual</span>
      <span class="text-lg font-bold mono text-accent">${fmtPct(currentUser.commissionPercent)}</span>
    </div>
    <div class="grid sm:grid-cols-3 gap-4">${cards}</div>`;
}
